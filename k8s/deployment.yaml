apiVersion: apps/v1
kind: Deployment
metadata:
  name: quiz-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: quiz-app

  template:
    metadata:
      labels:
        app: quiz-app

    spec:
      containers:
        - name: quiz-app
          image: vivekkumar1611/quiz-app:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 3000
