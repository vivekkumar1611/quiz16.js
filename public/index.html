<!DOCTYPE html>
<html>
<head>
  <title>Quiz App</title>
</head>
<body>
  <h1>Quiz App</h1>

  <div id="quiz"></div>

  <script>
    async function loadQuiz() {
      const res = await fetch("/quiz");
      const data = await res.json();

      let html = "";

      data.forEach(q => {
        html += `
          <div>
            <h3>${q.question}</h3>
            ${q.options.map(opt =>
              `<button onclick="submitAnswer(${q.id}, '${opt}')">${opt}</button>`
            ).join("<br>")}
            <hr/>
          </div>
        `;
      });

      document.getElementById("quiz").innerHTML = html;
    }

    async function submitAnswer(id, answer) {
      const res = await fetch(`/quiz/${id}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ answer })
      });

      const data = await res.json();
      alert(data.result + "\nScore: " + data.score);
    }

    loadQuiz();
  </script>
</body>
</html>
